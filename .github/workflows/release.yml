name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate tag and Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "void") | .version')"
          [[ "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Stable release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          test "${tag_version}" = "${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match crates/void version ${package_version}" >&2
            exit 1
          }
          test "$(uname -m)" = "arm64"

      - name: Run release checks
        run: |
          cargo fmt --check
          cargo check --workspace
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/void-release.p12"
          keychain_path="${RUNNER_TEMP}/void-release.keychain-db"
          printf '%s' "${APPLE_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          rm -f "${certificate_path}"
          security list-keychain -d user -s "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "${KEYCHAIN_PASSWORD}" \
            "${keychain_path}"

      - name: Bundle, sign, and notarize
        env:
          VOID_RELEASE_BUILD: "1"
          VOID_UPDATE_SIGNING_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./script/bundle-mac

      - name: Create update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          checksum="$(awk '{print $1}' target/release-artifacts/Void-aarch64.dmg.sha256)"
          [[ "${checksum}" =~ ^[0-9a-f]{64}$ ]]
          jq -n \
            --arg version "${version}" \
            --arg url "https://github.com/usamaasfar/void/releases/download/${GITHUB_REF_NAME}/Void-aarch64.dmg" \
            --arg sha256 "${checksum}" \
            '{version: $version, url: $url, sha256: $sha256}' \
            > target/release-artifacts/update.json
          test -s target/release-artifacts/update.json

      - name: Delete temporary signing keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/void-release.keychain-db" || true

      - name: Create published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            target/release-artifacts/Void-aarch64.dmg \
            target/release-artifacts/Void-aarch64.dmg.sha256 \
            target/release-artifacts/update.json
