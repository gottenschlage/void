[package]
name = "void"
version = "0.1.0"
description = "An AI-first coding workspace foundation with isolated branches and terminals."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
rust-embed.workspace = true
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui = { path = "../ui" }
workspace = { path = "../workspace" }
void_terminal = { path = "../void_terminal" }
void_update = { path = "../void_update" }

[package.metadata.bundle]
name = "Void"
identifier = "com.void.desktop"
icon = ["resources/app-icon@2x.png", "resources/app-icon.png"]
category = "Developer Tool"
short_description = "An AI-first coding workspace foundation."
copyright = "Copyright © 2026 Usama Asfar"
osx_minimum_system_version = "12.0"
