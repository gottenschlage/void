[package]
name = "void"
version = "0.1.0"
description = "An AI-first coding workspace for parallel coding agents."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
notify.workspace = true
petname.workspace = true
refineable.workspace = true
rust-embed.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smol.workspace = true
settings.workspace = true
tempfile.workspace = true
theme.workspace = true
util.workspace = true
ui = { path = "../ui" }
workspace = { path = "../workspace" }
void_terminal = { path = "../void_terminal" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[package.metadata.bundle]
name = "Void"
identifier = "com.void.desktop"
icon = ["resources/app-icon@2x.png", "resources/app-icon.png"]
category = "Developer Tool"
short_description = "An AI-first coding workspace for parallel coding agents."
copyright = "Copyright © 2026 Usama Asfar"
osx_minimum_system_version = "12.0"
